<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title">实时字幕</title>
  <link rel="stylesheet" href="/static/style.css?v=9">
</head>
<body>
  <header class="bar">
    <!-- 左侧：设置 + 品牌 + 语言方向，固定区域，不随右侧内容变化而位移 -->
    <div class="bar-left">
      <button id="settings-btn" class="gear" data-i18n-title="settings" title="设置" aria-label="settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <span class="brand" data-i18n="brand">实时字幕</span>
      <div class="dirs" role="group" aria-label="translation direction">
        <button class="dir active" data-dir="zh" data-i18n="dir_zh">中文 → EN</button>
        <button class="dir" data-dir="en" data-i18n="dir_en">EN → 中文</button>
      </div>
    </div>

    <!-- 右侧：预设、开始、状态，各占固定宽度 -->
    <div class="bar-right">
      <div class="presets">
        <label id="preset-label" class="preset-label" for="preset-select" data-i18n="preset">预设</label>
        <select id="preset-select" class="preset-select"></select>
        <button id="preset-add" class="ghost icon" data-i18n-title="new_preset" title="新建热词组">+</button>
        <button id="preset-manage" class="ghost icon" data-i18n-title="manage_preset" title="管理热词组">⋯</button>
      </div>
      <button id="toggle" class="primary" data-i18n="start">开始</button>
      <span id="level" class="level" data-i18n-title="mic_level" title="麦克风电平"></span>
      <span id="status" class="status">未连接</span>
    </div>
  </header>

  <div class="app">
    <main class="stage">
      <div id="scroll" class="scroll">
        <p class="empty" data-i18n="empty">点「开始」，允许麦克风权限，字幕会从下一句开始出现。</p>
      </div>
      <div id="interim" class="interim"></div>
    </main>

    <div id="resizer" class="resizer" title="拖动调整宽度"></div>

    <aside class="chat" id="chat">
      <div class="chat-head">
        <span class="chat-title" data-i18n="assistant">术语助手</span>
        <button id="chat-clear" class="ghost" data-i18n="clear" title="清空对话">清空</button>
      </div>
      <div id="chat-log" class="chat-log">
        <p class="chat-tip" data-i18n="chat_tip">
          可以问译法、术语含义，也能说「把某某加进热词」。
        </p>
      </div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" data-i18n-placeholder="chat_placeholder" placeholder="问术语或译法…" autocomplete="off">
        <button type="submit" id="chat-send" data-i18n="send">发送</button>
      </form>
    </aside>
  </div>

  <footer class="foot">
    <span data-i18n="foot">空格 开始 / 停止　　字幕保留在本页，刷新即清空</span>
  </footer>

  <!-- 与页面同风格的弹窗：新建 / 重命名 / 管理热词组 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <h3 id="modal-title" class="modal-title"></h3>
      <p id="modal-desc" class="modal-desc"></p>
      <input id="modal-input" class="modal-input" type="text" maxlength="24">
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="ghost" data-i18n="cancel">取消</button>
        <button id="modal-ok" class="primary">创建</button>
      </div>
    </div>
  </div>

  <!-- 顶部居中的轻提示，缺密钥时用 -->
  <div id="toast" class="toast" hidden>
    <span id="toast-text"></span>
    <a href="#" id="toast-action" hidden>去设置</a>
  </div>

  <!-- 设置界面 -->
  <div id="settings-modal" class="modal" hidden>
    <div class="modal-card settings-card" role="dialog" aria-modal="true">
      <h3 id="settings-title" class="modal-title">设置</h3>
      <p class="modal-desc" id="settings-desc"></p>
      <div id="settings-body" class="settings-body"></div>
      <div class="modal-actions">
        <button id="settings-cancel" class="ghost" data-i18n="cancel">取消</button>
        <button id="settings-save" class="primary" data-i18n="save">保存</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js?v=9"></script>
</body>
</html>
